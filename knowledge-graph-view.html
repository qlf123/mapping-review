<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全景图谱｜专业图谱平台</title>
<link rel="stylesheet" href="mapping-review.css" />
<link rel="stylesheet" href="mapping-polish.css" />
<link rel="stylesheet" href="mapping-compact.css" />
<style>
  .graph-canvas-wrap{position:relative;width:100%;height:calc(100vh - 60px);overflow:hidden;background:#f5f3fa;}
  .graph-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .graph-toolbar button{height:32px;padding:0 14px;border:1px solid #d4d4d4;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s;}
  .graph-toolbar button:hover{border-color:#5149e9;color:#5149e9;}
  .graph-legend{position:absolute;bottom:12px;left:12px;z-index:10;display:flex;gap:16px;padding:10px 16px;background:rgba(255,255,255,.92);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:12px;}
  .graph-legend-item{display:flex;align-items:center;gap:6px;}
  .graph-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .graph-info{position:absolute;top:12px;left:12px;z-index:10;display:flex;align-items:center;gap:8px;}
  .graph-info a{color:#5149e9;text-decoration:none;font-size:13px;}
  .graph-info a:hover{text-decoration:underline;}
  .graph-info h1{font-size:16px;font-weight:600;margin:0;color:#333;}
  svg.graph-svg{display:block;width:100%;height:100%;cursor:grab;}
  svg.graph-svg:active{cursor:grabbing;}
  .graph-node{cursor:pointer;transition:opacity .2s;}
  .graph-node:hover circle{stroke-width:2.5;}
  .graph-node text{font-size:11px;fill:#333;pointer-events:none;user-select:none;text-anchor:middle;}
  .graph-link{stroke:#ccc;stroke-width:1;fill:none;transition:stroke-width .2s,stroke .2s;}
  .graph-node.dimmed{opacity:.15;}
  .graph-link.dimmed{opacity:.08;}
  .graph-link.highlighted{stroke:#5149e9;stroke-width:2;}
  .graph-node-label{font-size:10px;fill:#555;pointer-events:none;user-select:none;text-anchor:middle;}
  .graph-tooltip{position:absolute;z-index:20;background:rgba(33,33,33,.92);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;white-space:nowrap;display:none;line-height:1.5;}
  .graph-search{height:32px;padding:0 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:180px;}
.graph-search-panel{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:6px;}
.graph-search-panel h3{font-size:13px;font-weight:600;margin:0 0 12px 0;color:#333;}
.graph-search-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.graph-search-row label{font-size:12px;color:#999;width:50px;flex-shrink:0;text-align:right;}
.graph-search-row select,.graph-search-row input{height:28px;padding:0 8px;border:1px solid #ddd;border-radius:5px;font-size:12px;flex:1;min-width:0;}
.graph-search-btn{height:30px;padding:0 14px;border:none;border-radius:5px;background:#5149e9;color:#fff;font-size:12px;cursor:pointer;}
.graph-search-btn:hover{background:#4038c0;}
.graph-search-btn.gray{background:#f0f0f0;color:#666;}
  .graph-icon-btn{width:30px;height:28px;padding:0;border:1px solid #d4d4d4;border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
  .graph-icon-btn:hover{border-color:#5149e9;}
  .graph-icon-btn.gray:hover{border-color:#f5222d;}
  .graph-icon-btn.gray svg path{stroke:#999;}
.graph-search-btn.gray:hover{background:#e0e0e0;}
.graph-path-result{margin-top:8px;padding:8px 10px;background:#f5f3fa;border-radius:6px;font-size:12px;color:#555;display:none;line-height:1.6;}
.graph-path-result .path-node{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#fff;border-radius:4px;margin:2px 0;}
.graph-path-result .path-arrow{color:#5149e9;margin:0 4px;font-weight:bold;}
.graph-quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.graph-quick-tag{padding:3px 10px;border-radius:12px;font-size:12px;cursor:pointer;border:1px solid #e8e8e8;background:#fff;color:#666;transition:all .15s;}
.graph-quick-tag:hover,.graph-quick-tag.active{background:#5149e9;color:#fff;border-color:#5149e9;}
.graph-search-panel.collapsed{padding:8px 14px;}
.graph-search-panel.collapsed .graph-search-body{display:none;}
  .graph-detail-panel{position:absolute;top:12px;right:12px;z-index:12;width:260px;background:#fff;border:1px solid #e8e8e8;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:14px 16px;display:none;}
  .graph-detail-panel.show{display:block;}
  .graph-detail-panel h4{font-size:14px;font-weight:600;margin:0 0 10px 0;color:#333;}
  .graph-detail-row{display:flex;gap:6px;font-size:12px;margin-bottom:6px;line-height:1.5;}
  .graph-detail-row span:first-child{color:#999;min-width:56px;}
  .graph-detail-row span:last-child{color:#333;}
  .graph-detail-connected{margin-top:8px;border-top:1px solid #f0f0f0;padding-top:8px;}
  .graph-detail-connected-title{font-size:12px;color:#999;margin-bottom:6px;}
  .graph-detail-connected-item{display:inline-block;padding:2px 8px;margin:2px;border-radius:4px;font-size:11px;background:#f5f3fa;color:#555;cursor:pointer;}
  .graph-detail-connected-item:hover{background:#5149e9;color:#fff;}
  .graph-detail-close{position:absolute;top:8px;right:12px;cursor:pointer;color:#999;font-size:18px;border:none;background:none;}
  .graph-result-count{font-size:12px;color:#999;margin-left:8px;}
  .graph-result-count strong{color:#5149e9;}
  .graph-search-suggest{position:absolute;z-index:20;background:#fff;border:1px solid #e8e8e8;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-height:160px;overflow-y:auto;display:none;}
  .graph-search-suggest-item{padding:4px 10px;font-size:12px;cursor:pointer;color:#555;}
  .graph-search-suggest-item:hover{background:#f5f3fa;color:#5149e9;}
  .graph-hover-label{position:absolute;z-index:15;background:rgba(33,33,33,.9);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;pointer-events:none;white-space:nowrap;display:none;}
  .graph-toolbar-btn{height:32px;padding:0 14px;border:1px solid #d4d4d4;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s;}
  .graph-toolbar-btn:hover{border-color:#5149e9;color:#5149e9;}
  .graph-search-tabs{display:flex;gap:0;border-bottom:1px solid #e8e8e8;margin-bottom:8px;}
  .graph-search-tab{padding:4px 16px;font-size:13px;color:#999;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;}
  .graph-search-tab.active{color:#5149e9;border-bottom-color:#5149e9;font-weight:600;}
  .graph-search-tab:hover{color:#5149e9;}
  .combo-select{position:relative;flex:1;min-width:80px;}
  .combo-input{width:100%;height:28px;padding:0 24px 0 8px;border:1px solid #ddd;border-radius:5px;font-size:12px;outline:none;box-sizing:border-box;}
  .combo-input:focus{border-color:#5149e9;}
  .combo-arrow{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:#999;pointer-events:none;}
  .combo-dropdown{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:30;background:#fff;border:1px solid #e8e8e8;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-height:140px;overflow-y:auto;display:none;}
  .combo-dropdown.open{display:block;}
  .combo-option{padding:4px 10px;font-size:12px;cursor:pointer;color:#555;}
  .combo-option:hover,.combo-option.selected{background:#f5f3fa;color:#5149e9;}
  .graph-search-content{display:none;}
  .graph-search-content.active{display:block;}
</style>
</head>
<body>
<aside class="platform-sidebar" aria-label="图谱平台导航">
  <div class="platform-brand">
    <span class="platform-brand-mark">图</span>
    <div><strong>专业图谱平台</strong><small>知识与能力管理</small></div>
  </div>
  <nav class="platform-nav">
    <div class="nav-section-title">图谱建设</div>

<div class="platform-page">
<main class="app-shell">
  <section class="page-heading">
    <div style="display:flex;gap:10px;align-items:center;width:100%;">
      <a href="knowledge-graph.html" style="color:#5149e9;text-decoration:none;font-size:14px;">← 返回</a>
      <h1 id="graphTitle">全景图谱</h1>
      <div style="display:flex;gap:8px;align-items:center;margin-left:auto;">
        <button id="zoomInBtn" type="button" class="graph-toolbar-btn">放大</button>
        <button id="zoomOutBtn" type="button" class="graph-toolbar-btn">缩小</button>
        <button id="resetBtn" type="button" class="graph-toolbar-btn">重置</button>
      </div>
    </div>
  </section>
  <div class="graph-canvas-wrap" id="canvasWrap">
    <div class="graph-search-panel" id="searchPanel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;">
        <h3 style="margin:0;">搜索</h3>
      </div>
      <div class="graph-search-body">
        <div class="graph-search-tabs">
          <span class="graph-search-tab active" data-tab="node">找节点</span>
          <span class="graph-search-tab" data-tab="path">找链路</span>
        </div>
        <div class="graph-search-content active" id="contentNode">
          <div class="graph-search-row">
            <div class="combo-select" id="filterIndustry" data-value="all">
              <input type="text" class="combo-input" placeholder="全部行业" autocomplete="off" />
              <span class="combo-arrow">▾</span>
              <div class="combo-dropdown">
                <div class="combo-option" data-value="all" data-label="全部行业">全部行业</div>
                <div class="combo-option" data-value="旅游" data-label="旅游业">旅游业</div>
                <div class="combo-option" data-value="电商" data-label="电商行业">电商行业</div>
              </div>
            </div>
            <div class="combo-select" id="filterMajor" data-value="all">
              <input type="text" class="combo-input" placeholder="全部专业" autocomplete="off" />
              <span class="combo-arrow">▾</span>
              <div class="combo-dropdown">
                <div class="combo-option" data-value="all" data-label="全部专业">全部专业</div>
                <div class="combo-option" data-value="旅游管理" data-label="旅游管理">旅游管理</div>
                <div class="combo-option" data-value="酒店管理" data-label="酒店管理">酒店管理</div>
                <div class="combo-option" data-value="景区开发" data-label="景区开发">景区开发</div>
              </div>
            </div>
            <select id="filterNodeType"><option value="all">全部类型</option><option value="课程">课程</option><option value="章节">章节</option><option value="知识点">知识点</option><option value="技能规范">技能规范</option><option value="核心概念">核心概念</option></select>
            <input id="quickSearchInput" placeholder="节点名称" style="flex:1;min-width:100px;" />
            <button class="graph-search-btn" id="quickSearchBtn" type="button">搜索</button>
            <button class="graph-search-btn gray" id="clearNodeBtn" type="button">清除</button>
            <span class="graph-result-count" id="resultCount"></span>
          </div>
        </div>
        <div class="graph-search-content" id="contentPath">
          <div class="graph-search-row">
            <select id="pathStartType"><option value="all">全部类型</option><option value="课程">课程</option><option value="章节">章节</option><option value="知识点">知识点</option><option value="技能规范">技能规范</option><option value="核心概念">核心概念</option></select>
            <input id="pathStart" placeholder="起点节点名称" style="flex:1;min-width:80px;" />
            <span style="color:#999;font-size:13px;">→</span>
            <select id="pathEndType"><option value="all">全部类型</option><option value="课程">课程</option><option value="章节">章节</option><option value="知识点">知识点</option><option value="技能规范">技能规范</option><option value="核心概念">核心概念</option></select>
            <input id="pathEnd" placeholder="终点节点名称" style="flex:1;min-width:80px;" />
            <button class="graph-search-btn" id="pathSearchBtn" type="button">查找链路</button>
            <button class="graph-search-btn gray" id="clearFilterBtn" type="button">清除</button>
          </div>
          <div class="graph-path-result" id="pathResult"></div>
        </div>
        <div class="graph-search-suggest" id="searchSuggest"></div>
      </div>
    </div>

    <div class="graph-detail-panel" id="detailPanel">
      <button class="graph-detail-close" id="detailClose">×</button>
      <h4 id="detailTitle"></h4>
      <div id="detailBody"></div>
    </div>
    <div class="graph-hover-label" id="hoverLabel"></div>
    <div class="graph-legend">
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#52c41a;"></span>知识点</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#1890ff;"></span>技能规范</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#722ed1;"></span>课程</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#fa8c16;"></span>章节</div>
      <div class="graph-legend-item"><span class="graph-legend-dot" style="background:#f5222d;"></span>核心概念</div>
    </div>
    <div class="graph-tooltip" id="tooltip"></div>
    <svg class="graph-svg" id="graphSvg"></svg>
  </div>
</main>
</div>
<script>
  var taskName = sessionStorage.getItem('viewTaskName') || '';
  if(taskName){
    var t = document.getElementById('graphTitle');
    if(t) t.textContent = taskName + ' · 全景图谱';
  }
(function(){
  var typeColors = {'知识点':'#52c41a','技能规范':'#1890ff','课程':'#722ed1','章节':'#fa8c16','核心概念':'#f5222d'};
  var typeRadius = {'知识点':6,'技能规范':7,'课程':10,'章节':8,'核心概念':9};

  function generateData(){
    var nodes=[], links=[], idc=0;
    var courses=['旅游学概论','导游实务','旅游营销','酒店管理','景区开发','旅游地理','旅游法规','客户服务'];
    var chapters=['第一章','第二章','第三章','第四章','第五章'];
    var knNames=['旅游概念','旅游资源','旅游业','旅游产品','旅游市场','旅游文化','旅游心理','旅游行为','旅游动机','旅游决策','旅游体验','旅游满意度','目的地形象','旅游规划','可持续旅游','生态旅游','文化旅游','遗产旅游','乡村旅游','智慧旅游'];
    var skNames=['线路设计','行程规划','成本核算','客户沟通','应急处理','资源调度','市场分析','渠道管理','服务标准','质量管控','投诉处理','团队管理','预算编制','合同管理','安全管理','风险管理','数据统计','报告撰写','方案策划','项目执行'];
    var cpNames=['OTA平台','旅游电商','共享经济','区块链','AI推荐','大数据','云计算','物联网','5G应用','元宇宙'];
    var industries=['旅游','旅游','旅游','旅游','旅游','旅游','旅游','旅游'];
    courses.forEach(function(c,i){nodes.push({id:idc++,name:c,type:'课程',industry:industries[i]||'旅游',major:courses[i].indexOf('酒店')>=0?'酒店管理':courses[i].indexOf('景区')>=0?'景区开发':'旅游管理'})});
    chapters.forEach(function(c){nodes.push({id:idc++,name:c,type:'章节',industry:'旅游',major:'旅游管理'})});
    knNames.forEach(function(n){nodes.push({id:idc++,name:n,type:'知识点',industry:'旅游',major:'旅游管理'})});
    skNames.forEach(function(n){nodes.push({id:idc++,name:n,type:'技能规范',industry:'旅游',major:'旅游管理'})});
    cpNames.forEach(function(n){nodes.push({id:idc++,name:n,type:'核心概念',industry:'旅游',major:'旅游管理'})});
    var nC=courses.length,nCh=chapters.length,nK=knNames.length,nS=skNames.length;
    for(var i=0;i<nC;i++)for(var j=0;j<nCh;j++){if(Math.random()>0.6)links.push({source:i,target:nC+j})}
    for(var i=0;i<nC;i++)for(var k=0;k<nK;k++){if(Math.random()>0.75)links.push({source:i,target:nC+nCh+k})}
    for(var j=0;j<nCh;j++)for(var k=0;k<nK;k++){if(Math.random()>0.7)links.push({source:nC+j,target:nC+nCh+k})}
    for(var k=0;k<nK;k++)for(var s=0;s<nS;s++){if(Math.random()>0.8)links.push({source:nC+nCh+k,target:nC+nCh+nK+s})}
    var cpStart=nC+nCh+nK+nS;
    for(var c=0;c<cpNames.length;c++)for(var k=0;k<nK;k++){if(Math.random()>0.75)links.push({source:cpStart+c,target:nC+nCh+k})}
    for(var c=0;c<cpNames.length;c++)for(var s=0;s<nS;s++){if(Math.random()>0.85)links.push({source:cpStart+c,target:nC+nCh+nK+s})}
    for(var k=0;k<nK;k++)for(var k2=k+1;k2<nK;k2++){if(Math.random()>0.88)links.push({source:nC+nCh+k,target:nC+nCh+k2})}
    return {nodes:nodes,links:links};
  }

  var data=generateData();
  var nodes=data.nodes;
  var links=data.links;
  var wrap=document.getElementById('canvasWrap');
  var W=wrap.clientWidth, H=wrap.clientHeight;
  nodes.forEach(function(n){n.x=W/2+(Math.random()-0.5)*400;n.y=H/2+(Math.random()-0.5)*400;n.vx=0;n.vy=0});
  var alpha=1,alphaMin=0.005,alphaDecay=0.005;

  function tick(){
    if(alpha<alphaMin)return;
    alpha*=(1-alphaDecay);
    for(var i=0;i<nodes.length;i++){var ni=nodes[i];for(var j=i+1;j<nodes.length;j++){var nj=nodes[j];var dx=nj.x-ni.x,dy=nj.y-ni.y;var d=Math.sqrt(dx*dx+dy*dy)||1;var f=(-120)/(d*d)*alpha;ni.vx-=dx/d*f;ni.vy-=dy/d*f;nj.vx+=dx/d*f;nj.vy+=dy/d*f}}
    for(var l=0;l<links.length;l++){var s=nodes[links[l].source],t=nodes[links[l].target];var dx=t.x-s.x,dy=t.y-s.y;var d=Math.sqrt(dx*dx+dy*dy)||1;var f=(d-60)*0.1*alpha;s.vx+=dx/d*f;s.vy+=dy/d*f;t.vx-=dx/d*f;t.vy-=dy/d*f}
    var cx=W/2,cy=H/2;
    for(var i=0;i<nodes.length;i++){var n=nodes[i];n.vx+=(cx-n.x)*0.02*alpha;n.vy+=(cy-n.y)*0.02*alpha}
    for(var i=0;i<nodes.length;i++){var n=nodes[i];n.vx*=0.6;n.vy*=0.6;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(20,Math.min(W-20,n.x));n.y=Math.max(20,Math.min(H-20,n.y))}
  }

  var svg=document.getElementById('graphSvg');
  var tooltip=document.getElementById('tooltip');
  var zoom=1,panX=0,panY=0;
  var SVGNS='http://www.w3.org/2000/svg';

  function render(){
    tick();
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    var g=document.createElementNS(SVGNS,'g');
    g.setAttribute('transform','translate('+panX+','+panY+') scale('+zoom+')');
    for(var l=0;l<links.length;l++){var s=nodes[links[l].source],t=nodes[links[l].target];var ln=document.createElementNS(SVGNS,'line');ln.setAttribute('x1',s.x);ln.setAttribute('y1',s.y);ln.setAttribute('x2',t.x);ln.setAttribute('y2',t.y);ln.setAttribute('class','graph-link');ln.setAttribute('data-source',links[l].source);ln.setAttribute('data-target',links[l].target);g.appendChild(ln)}
    for(var i=0;i<nodes.length;i++){var n=nodes[i];var ng=document.createElementNS(SVGNS,'g');ng.setAttribute('class','graph-node');ng.setAttribute('transform','translate('+n.x+','+n.y+')');ng.setAttribute('data-id',n.id);ng.setAttribute('data-name',n.name);ng.setAttribute('data-type',n.type);
      var c=document.createElementNS(SVGNS,'circle');c.setAttribute('r',typeRadius[n.type]||6);c.setAttribute('fill',typeColors[n.type]||'#999');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','1.5');ng.appendChild(c);
      if(zoom>1.5||n.type==='课程'||n.type==='核心概念'){var tx=document.createElementNS(SVGNS,'text');tx.setAttribute('class','graph-node-label');tx.setAttribute('y',(typeRadius[n.type]||6)+12);tx.textContent=n.name;ng.appendChild(tx)}
      ng.addEventListener('mousedown',startDrag);
      ng.addEventListener('mouseenter',function(e){var nd=e.target.closest('.graph-node');if(!nd)return;var nm=nd.getAttribute('data-name'),tp=nd.getAttribute('data-type');tooltip.style.display='block';tooltip.innerHTML='<strong>'+nm+'</strong><br/>'+tp;var rect=wrap.getBoundingClientRect();tooltip.style.left=(e.clientX-rect.left+15)+'px';tooltip.style.top=(e.clientY-rect.top+15)+'px';var nid=Number(nd.getAttribute('data-id'));var conn={};conn[nid]=true;links.forEach(function(l){if(l.source===nid)conn[l.target]=true;if(l.target===nid)conn[l.source]=true});svg.querySelectorAll('.graph-node').forEach(function(nn){var id=Number(nn.getAttribute('data-id'));if(!conn[id])nn.classList.add('dimmed');else nn.classList.remove('dimmed')});svg.querySelectorAll('.graph-link').forEach(function(lk){var s2=Number(lk.getAttribute('data-source')),t2=Number(lk.getAttribute('data-target'));if(s2===nid||t2===nid){lk.classList.add('highlighted');lk.classList.remove('dimmed')}else{lk.classList.add('dimmed');lk.classList.remove('highlighted')}})});
      ng.addEventListener('mouseleave',function(){tooltip.style.display='none';svg.querySelectorAll('.graph-node').forEach(function(n){n.classList.remove('dimmed')});svg.querySelectorAll('.graph-link').forEach(function(l){l.classList.remove('dimmed');l.classList.remove('highlighted')})});
      g.appendChild(ng)}
    svg.appendChild(g);
  }

  var running=true;
  function animate(){if(running){render();if(alpha<alphaMin)running=false}requestAnimationFrame(animate)}

  var dragNode=null,dragOffset={x:0,y:0};
  function startDrag(e){e.preventDefault();var ng=e.target.closest('.graph-node');if(!ng)return;var id=Number(ng.getAttribute('data-id'));dragNode=nodes[id];var pt=svgPoint(svg,e);dragOffset.x=pt.x/zoom-panX/zoom-dragNode.x;dragOffset.y=pt.y/zoom-panY/zoom-dragNode.y;alpha=Math.max(alpha,0.3);if(!running){running=true;animate()}window.addEventListener('mousemove',onDrag);window.addEventListener('mouseup',endDrag)}
  function onDrag(e){if(!dragNode)return;var pt=svgPoint(svg,e);dragNode.x=pt.x/zoom-panX/zoom-dragOffset.x;dragNode.y=pt.y/zoom-panY/zoom-dragOffset.y;dragNode.vx=0;dragNode.vy=0;alpha=Math.max(alpha,0.3);if(!running){running=true;animate()}}
  function endDrag(){dragNode=null;window.removeEventListener('mousemove',onDrag);window.removeEventListener('mouseup',endDrag)}
  function svgPoint(el,e){var pt=el.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(el.getScreenCTM().inverse())}

  var panning=false,panStart={x:0,y:0};
  svg.addEventListener('mousedown',function(e){if(e.target.tagName==='svg'){panning=true;panStart.x=e.clientX-panX;panStart.y=e.clientY-panY}});
  window.addEventListener('mousemove',function(e){if(panning){panX=e.clientX-panStart.x;panY=e.clientY-panStart.y;if(!running)render()}});
  window.addEventListener('mouseup',function(){panning=false});
  document.getElementById('zoomInBtn').addEventListener('click',function(){zoom=Math.min(zoom*1.3,5);render()});
  document.getElementById('zoomOutBtn').addEventListener('click',function(){zoom=Math.max(zoom/1.3,0.2);render()});
  document.getElementById('resetBtn').addEventListener('click',function(){zoom=1;panX=0;panY=0;alpha=1;running=true;animate()});
  svg.addEventListener('wheel',function(e){e.preventDefault();var d=e.deltaY>0?0.9:1.1;zoom=Math.max(0.2,Math.min(5,zoom*d));render()});

  document.getElementById('clearFilterBtn').addEventListener('click',function(){
    document.getElementById('quickSearchInput').value='';
    comboSetValue('filterIndustry','all');
    comboSetValue('filterMajor','all');
    document.getElementById('pathStartType').value='all';
    document.getElementById('pathEndType').value='all';
    document.getElementById('filterNodeType').value='all';
    document.getElementById('pathStart').value='';
    document.getElementById('pathEnd').value='';
    document.getElementById('pathResult').style.display='none';
    clearFilters();
  });

  // Quick search
  var quickInput=document.getElementById('quickSearchInput');
  var searchSuggest=document.getElementById('searchSuggest');
  var pathResult=document.getElementById('pathResult');
  var resultCount=document.getElementById('resultCount');

  function doQuickSearch(){
    var q=quickInput.value.trim().toLowerCase();
    var fType=document.getElementById('filterNodeType').value;
    var fInd=comboGetValue('filterIndustry');
    var fMaj=comboGetValue('filterMajor');
    var m={};
    nodes.forEach(function(n){
      var ok=true;
      if(q&&n.name.toLowerCase().indexOf(q)<0)ok=false;
      if(fType!=='all'&&n.type!==fType)ok=false;
      if(fInd!=='all'&&(!n.industry||n.industry!==fInd))ok=false;
      if(fMaj!=='all'&&(!n.major||n.major!==fMaj))ok=false;
      if(ok)m[n.id]=true;
    });
    var count=Object.keys(m).length;
    links.forEach(function(l){if(m[l.source])m[l.target]=true;if(m[l.target])m[l.source]=true});
    svg.querySelectorAll('.graph-node').forEach(function(nn){
      var id=Number(nn.getAttribute('data-id'));
      if(m[id]){nn.classList.remove('dimmed');nn.classList.add('highlighted')}else{nn.classList.add('dimmed');nn.classList.remove('highlighted')}
    });
    svg.querySelectorAll('.graph-link').forEach(function(lk){
      var s=Number(lk.getAttribute('data-source')),t=Number(lk.getAttribute('data-target'));
      if(m[s]&&m[t])lk.classList.remove('dimmed');else lk.classList.add('dimmed');
    });
    resultCount.innerHTML=q||fType!=='all'?'找到 <strong>'+count+'</strong> 个节点':'';
    pathResult.style.display='none';
  }

  quickInput.addEventListener('keydown',function(e){if(e.key==='Enter'){doQuickSearch();searchSuggest.style.display='none'}});
  var qt;quickInput.addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(doQuickSearch,500);showSuggest()});
  document.getElementById('quickSearchBtn').addEventListener('click',function(){doQuickSearch();searchSuggest.style.display='none'});
  document.getElementById('filterNodeType').addEventListener('change',doQuickSearch);
  document.getElementById('filterIndustry').addEventListener('change',doQuickSearch);
  document.getElementById('filterMajor').addEventListener('change',doQuickSearch);
  document.getElementById('pathStartType').addEventListener('change',function(){document.getElementById('pathStart').dispatchEvent(new Event('input'))});
  document.getElementById('pathEndType').addEventListener('change',function(){document.getElementById('pathEnd').dispatchEvent(new Event('input'))});

  // Path search
  function doPathSearch(){
    var sName=document.getElementById('pathStart').value.trim();
    var eName=document.getElementById('pathEnd').value.trim();
    var sType=document.getElementById('pathStartType').value;
    var eType=document.getElementById('pathEndType').value;
    if(!sName||!eName)return;
    var sNode=nodes.find(function(n){var ok=n.name.toLowerCase()===sName.toLowerCase()||n.name.toLowerCase().indexOf(sName.toLowerCase())>=0;if(sType!=='all'&&n.type!==sType)ok=false;return ok});
    var eNode=nodes.find(function(n){var ok=n.name.toLowerCase()===eName.toLowerCase()||n.name.toLowerCase().indexOf(eName.toLowerCase())>=0;if(eType!=='all'&&n.type!==eType)ok=false;return ok});
    if(!sNode||!eNode){
      pathResult.style.display='block';
      pathResult.innerHTML='<span style="color:#f5222d;">未找到节点「'+(!sNode?sName:eName)+'」</span>';
      return;
    }
    var adj={};
    links.forEach(function(l){if(!adj[l.source])adj[l.source]=[];if(!adj[l.target])adj[l.target]=[];adj[l.source].push(l.target);adj[l.target].push(l.source)});
    var visited={};visited[sNode.id]=true;
    var queue=[[sNode.id]];var found=null;
    while(queue.length){var path=queue.shift();var cur=path[path.length-1];if(cur===eNode.id){found=path;break}var nb=adj[cur]||[];for(var i=0;i<nb.length;i++){if(!visited[nb[i]]){visited[nb[i]]=true;queue.push(path.concat([nb[i]]))}}}
    if(!found){pathResult.style.display='block';pathResult.innerHTML='<span style="color:#f5222d;">未找到从「'+sNode.name+'」到「'+eNode.name+'」的链路</span>';return}
    var ps={};found.forEach(function(id){ps[id]=true});
    svg.querySelectorAll('.graph-node').forEach(function(nn){var id=Number(nn.getAttribute('data-id'));if(ps[id]){nn.classList.remove('dimmed');nn.classList.add('highlighted')}else{nn.classList.add('dimmed');nn.classList.remove('highlighted')}});
    svg.querySelectorAll('.graph-link').forEach(function(lk){var s=Number(lk.getAttribute('data-source')),t=Number(lk.getAttribute('data-target'));var on=false;for(var i=0;i<found.length-1;i++){if((s===found[i]&&t===found[i+1])||(t===found[i]&&s===found[i+1])){on=true;break}}if(on){lk.classList.add('highlighted');lk.classList.remove('dimmed')}else{lk.classList.add('dimmed');lk.classList.remove('highlighted')}});
    pathResult.style.display='block';
    var html='<span style="color:#999;">链路：</span>';
    found.forEach(function(id,i){var n=nodes[id];html+='<span class="path-node"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+typeColors[n.type]+';"></span>'+n.name+'</span>';if(i<found.length-1)html+='<span class="path-arrow">→</span>'});
    html+=' <span style="color:#999;margin-left:8px;">('+found.length+' 节点)</span>';
    pathResult.innerHTML=html;
    resultCount.innerHTML='链路 <strong>'+found.length+'</strong> 节点';
  }
  document.getElementById('pathSearchBtn').addEventListener('click',doPathSearch);
  document.getElementById('pathEnd').addEventListener('keydown',function(e){if(e.key==='Enter')doPathSearch()});

  // Clear
  document.getElementById('clearFilterBtn').addEventListener('click',function(){
    quickInput.value='';document.getElementById('pathStart').value='';document.getElementById('pathEnd').value='';
    document.getElementById('filterNodeType').value='all';
    comboSetValue('filterIndustry','all');
    comboSetValue('filterMajor','all');
    document.getElementById('pathStartType').value='all';
    document.getElementById('pathEndType').value='all';
    pathResult.style.display='none';resultCount.innerHTML='';clearFilters();
  });

  // Suggestions for both inputs
  function showSuggest(){
    var q=quickInput.value.trim().toLowerCase();
    if(!q){searchSuggest.style.display='none';return}
    var matches=nodes.filter(function(n){return n.name.toLowerCase().indexOf(q)>=0}).slice(0,6);
    if(matches.length===0){searchSuggest.style.display='none';return}
    var rect=quickInput.getBoundingClientRect();var wrapRect=canvasWrap.getBoundingClientRect();
    searchSuggest.style.left=(rect.left-wrapRect.left)+'px';searchSuggest.style.top=(rect.bottom-wrapRect.top+2)+'px';searchSuggest.style.width=rect.width+'px';
    searchSuggest.innerHTML='';
    matches.forEach(function(m){var item=document.createElement('div');item.className='graph-search-suggest-item';item.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+typeColors[m.type]+';margin-right:6px;"></span>'+m.name;item.addEventListener('click',function(){quickInput.value=m.name;searchSuggest.style.display='none';doQuickSearch()});searchSuggest.appendChild(item)});
    searchSuggest.style.display='block';
  }
  quickInput.addEventListener('blur',function(){setTimeout(function(){searchSuggest.style.display='none'},200)});

  // Suggest for path inputs
  function setupPathSuggest(inputId,typeId){
    var inp=document.getElementById(inputId);
    inp.addEventListener('input',function(){
      var q=this.value.trim().toLowerCase();if(!q){searchSuggest.style.display='none';return}
      var tp=document.getElementById(typeId).value;
      var matches=nodes.filter(function(n){if(tp!=='all'&&n.type!==tp)return false;return n.name.toLowerCase().indexOf(q)>=0}).slice(0,6);
      if(matches.length===0){searchSuggest.style.display='none';return}
      var rect=this.getBoundingClientRect();var wrapRect=canvasWrap.getBoundingClientRect();
      searchSuggest.style.left=(rect.left-wrapRect.left)+'px';searchSuggest.style.top=(rect.bottom-wrapRect.top+2)+'px';searchSuggest.style.width=rect.width+'px';
      searchSuggest.innerHTML='';
      matches.forEach(function(m){var item=document.createElement('div');item.className='graph-search-suggest-item';item.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+typeColors[m.type]+';margin-right:6px;"></span>'+m.name;item.addEventListener('click',function(){inp.value=m.name;searchSuggest.style.display='none'});searchSuggest.appendChild(item)});
      searchSuggest.style.display='block';
    });
    inp.addEventListener('blur',function(){setTimeout(function(){searchSuggest.style.display='none'},200)});
  }
  setupPathSuggest('pathStart','pathStartType');setupPathSuggest('pathEnd','pathEndType');

  // Combo select helpers
  function comboGetValue(id){
    var el=document.getElementById(id);
    return el?el.getAttribute('data-value'):'all';
  }
  function comboSetValue(id,val){
    var el=document.getElementById(id);
    if(!el)return;
    el.setAttribute('data-value',val);
    var inp=el.querySelector('.combo-input');
    var opt=el.querySelector('.combo-option[data-value="'+val+'"]');
    inp.value='';
    inp.placeholder=opt?opt.getAttribute('data-label'):'';
    el.querySelectorAll('.combo-option').forEach(function(o){o.classList.toggle('selected',o.getAttribute('data-value')===val)});
  }
  function comboInit(id){
    var el=document.getElementById(id);
    if(!el)return;
    var inp=el.querySelector('.combo-input');
    var dd=el.querySelector('.combo-dropdown');
    var opts=el.querySelectorAll('.combo-option');
    inp.addEventListener('focus',function(){
      // Show all on focus
      opts.forEach(function(o){o.style.display=''});
      dd.classList.add('open');
    });
    inp.addEventListener('input',function(){
      var q=this.value.trim().toLowerCase();
      opts.forEach(function(o){
        var label=o.getAttribute('data-label').toLowerCase();
        o.style.display=label.indexOf(q)>=0?'':'none';
      });
      dd.classList.add('open');
    });
    inp.addEventListener('blur',function(){
      setTimeout(function(){dd.classList.remove('open')},150);
    });
    opts.forEach(function(o){
      o.addEventListener('click',function(){
        var val=o.getAttribute('data-value');
        var label=o.getAttribute('data-label');
        el.setAttribute('data-value',val);
        inp.value='';
        inp.placeholder=label;
        opts.forEach(function(x){x.classList.toggle('selected',x===o)});
        dd.classList.remove('open');
      });
    });
  }
  comboInit('filterIndustry');
  comboInit('filterMajor');

  // Tab switching
  document.querySelectorAll('.graph-search-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      document.querySelectorAll('.graph-search-tab').forEach(function(t){t.classList.remove('active')});
      tab.classList.add('active');
      var isNode=tab.dataset.tab==='node';
      document.getElementById('contentNode').classList.toggle('active',isNode);
      document.getElementById('contentPath').classList.toggle('active',!isNode);
    });
  });
  // Clear for node search tab
  document.getElementById('clearNodeBtn').addEventListener('click',function(){
    document.getElementById('quickSearchInput').value='';
    comboSetValue('filterIndustry','all');
    comboSetValue('filterMajor','all');
    document.getElementById('filterNodeType').value='all';
    document.getElementById('resultCount').innerHTML='';
    clearFilters();
  });

  animate();
})();
</script>
</body>
